version: 2

# Weekly, on Monday morning (UTC), so a week's worth of bumps arrives as a
# handful of grouped PRs instead of a trickle. Every PR goes through Checks.
# Security updates are not affected by the schedule, the groups or the cooldown:
# GitHub opens those as soon as an advisory lands (enable "Dependabot security
# updates" in Settings → Code security).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    # A release a few days old is the one most likely to be yanked or to carry
    # a compromised publish; let it age before it reaches the lockfile.
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: 'build'
      include: scope
    groups:
      # xterm and its addons in one PR, apart from the generic prod group.
      # Only what is safe to take as a bump reaches it — xterm minors and
      # patches, addon patches; the moves across xterm lines are ignored below.
      # Listed first because a dependency joins the first group it matches.
      xterm:
        patterns: ['@xterm/*']
        update-types: [minor, patch]
      # The semantic diff's WASM runtime (a dependency) and its grammars
      # (devDependencies whose .wasm ships) share an ABI and a module format:
      # every grammar must load in the installed web-tree-sitter, and 0.25
      # stranded all older builds at once. One PR for the set, and
      # test/semanticGrammars.test.ts loads every grammar against the runtime
      # in it. The cooldown is per dependency, so a runtime and the grammar
      # releases built for it may still arrive in different weeks: a red PR
      # means a grammar fell behind the runtime (or vendor/tree-sitter-swift
      # needs the rebuild its README describes). Fix that; do not merge it red.
      tree-sitter:
        patterns: ['web-tree-sitter', 'tree-sitter-*', '@tree-sitter-grammars/*']
        update-types: [minor, patch]
      # Tooling: one PR for every minor/patch devDependency bump.
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['electron', 'electron-builder', 'electron-vite']
      # What ships inside the app: kept apart from tooling so a runtime change
      # is never buried in a dozen linter bumps.
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      # Electron is the runtime the app ships, so even its minor/patch bumps
      # get their own PR (and their own changelog read).
      electron:
        patterns: ['electron', 'electron-builder', 'electron-vite']
        update-types: [minor, patch]
    ignore:
      # Majors of the runtime and the packager are migrations, not bumps: a new
      # Electron major moves Chromium and Node, can break node-pty's native
      # rebuild and the sandbox, and an electron-builder or electron-vite major
      # changes the build and publish config the release pipeline depends on.
      # They are done by hand, on a branch, with a test release.
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: electron-builder
        update-types: ['version-update:semver-major']
      - dependency-name: electron-vite
        update-types: ['version-update:semver-major']
      # An xterm major is a migration like Electron's, done by hand: the 5 -> 6
      # move needed fixes no test caught (Alt+arrow word jumps, the scroll
      # position after a resize). Its addons are 0.x, so an addon "minor" is
      # the release built for the next xterm line (0.11/0.12 declare no xterm
      # peer, so nothing stops it installing against the old one). Grouping
      # alone does not keep them together: the cooldown is per dependency and
      # per update type (14 days for majors, 7 otherwise), so addons for a new
      # xterm could arrive a week before xterm itself. Ignore both; they move
      # together on a migration branch.
      - dependency-name: '@xterm/xterm'
        update-types: ['version-update:semver-major']
      - dependency-name: '@xterm/addon-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  # Keeps the SHA pins in .github/workflows current: Dependabot rewrites both
  # the SHA and the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      actions:
        patterns: ['*']
