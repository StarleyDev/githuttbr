name: Checks

# The gate from CLAUDE.md — typecheck, the i18n and docs guards, the test
# suite, the build — on every pull request and every push to main. Until now
# only a release tag built anything, so a PR's first real run was the release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the older run moot. Pushes to main are
# not cancelled: each merge keeps its own verdict, so a break is pinned on
# the merge that caused it.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No global git identity on purpose. The suite isolates git itself
      # (test/setup/global-setup.ts points GIT_CONFIG_GLOBAL at its own file
      # with user.useConfigOnly and sets GIT_CONFIG_NOSYSTEM), so a test that
      # commits must bring its own identity — here exactly as on a laptop.
      # A global identity set here would only hide that, as it once did.
      - name: Typecheck
        run: npm run typecheck

      - name: i18n guard
        run: npm run lint:i18n

      - name: Docs guard
        run: npm run lint:docs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Electron is a devDependency, so `npm audit --omit=dev` never reports it
      # even though it is the runtime the app ships. Needs the network, which
      # is why it lives here and not in the local gate.
      - name: Electron advisories
        run: npm run audit:electron

  # The slice of the gate that means something on the other two platforms the
  # app ships for. Release builds Windows and macOS only on a tag, so until
  # now a Windows-only break (a path separator, a script that assumes POSIX)
  # surfaced as a failed release. The git-backed tests stay in `gate` above:
  # their playground is generated by bash scripts, which on a Windows runner
  # may resolve to WSL and on macOS is bash 3.2. The test selection, and why,
  # is in .github/vitest.portable.config.ts.
  portable:
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Git for Windows checks text files out as CRLF by default. The repo has
      # no .gitattributes, and the guards and tests compare text written on
      # Linux; keep the bytes the same as there so a failure here is about the
      # platform, not about line endings.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: i18n guard
        run: npm run lint:i18n

      - name: Docs guard
        run: npm run lint:docs

      - name: Pure tests
        run: npx vitest run --config .github/vitest.portable.config.ts

      # The same electron-vite build Release runs on this OS, minus packaging:
      # sync-grammars and gen-licenses walk node_modules with platform paths.
      - name: Build
        run: npm run build
