name: Upstream watch

# GitHuttBr follows Gitcito. Once a day, see whether the upstream main has
# commits this fork's main lacks, and keep one issue saying so: opened or
# updated while there are, closed once main has caught up.
#
# It only reads and writes an issue — never code. Merging upstream into main is
# done locally with scripts/sync-upstream.sh: the Actions token cannot push
# commits that touch .github/workflows, and upstream updates sometimes do.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    # A copy of this fork would otherwise watch on someone else's behalf.
    if: github.repository == 'StarleyDev/githuttbr'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM: MyAppDesk/gitcito
      TITLE: 'Upstream Gitcito has new commits'
    steps:
      - name: Compare with upstream and update the issue
        run: |
          set -euo pipefail
          # Commits upstream main has that this repository's main does not.
          behind=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${UPSTREAM%%/*}:gitcito:main" -q '.ahead_by')
          latest=$(gh api "repos/${UPSTREAM}/releases/latest" -q '.tag_name' 2>/dev/null || echo 'none')
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number // empty')
          if [ "$behind" = "0" ]; then
            echo "Up to date with ${UPSTREAM}."
            if [ -n "$issue" ]; then gh issue close "$issue" -R "$GITHUB_REPOSITORY" -c "main has caught up with ${UPSTREAM}."; fi
            exit 0
          fi
          body=$(cat <<BODY
          **${behind}** commit(s) on [${UPSTREAM}](https://github.com/${UPSTREAM}) main are not in this repository's main yet.
          Latest upstream release: **${latest}** — [compare](https://github.com/${GITHUB_REPOSITORY}/compare/main...${UPSTREAM%%/*}:gitcito:main).

          To bring them in, on your machine:

          \`\`\`sh
          scripts/sync-upstream.sh
          \`\`\`

          It fetches upstream, merges it into main, runs the gate and tells you what to keep if the brand files conflict. Then push and cut a release.

          _Updated by the Upstream watch workflow._
          BODY
          )
          if [ -n "$issue" ]; then
            gh issue edit "$issue" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
