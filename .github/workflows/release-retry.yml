name: Release retry

# A Release run whose macOS job never got a runner (GitHub's macOS queue runs
# dry now and then: the job sits queued and is cancelled without a single step)
# has that job re-run, up to MAX_ATTEMPTS attempts in all, without anyone having
# to notice. Only the macOS jobs are ever re-run, by id — never the whole run,
# never draft, Linux, Windows or publish. That matters because this also fires
# on a run a maintainer cancelled by hand: re-running publish then could make a
# bad draft public, while the macOS job only uploads assets and never publishes.
# A real build failure ran steps, and scripts/release-retry.mjs leaves it alone.
# A Linux or Windows job that never started is only reported, for a person.
#
# After the last attempt, Release mac backfill (every 6 h, for 48 h) takes over
# for macOS, and the "vX.Y.Z: macOS build missing" issue says so.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    # Not only 'failure': a run whose only bad job was cancelled in the queue
    # concludes 'cancelled', and that is exactly the case worth retrying.
    if: >-
      contains(fromJSON('["failure","cancelled","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    env:
      MAX_ATTEMPTS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Re-run jobs that never started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          # Read the run as it is now, not as the event saw it: someone may
          # have re-run it by hand in the meantime.
          gh api "$api" > "$RUNNER_TEMP/run.json"
          gh api "$api/attempts/$ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          if ! verdict="$(node scripts/release-retry.mjs "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/run.json" "$ATTEMPT" "$MAX_ATTEMPTS" \
            2> "$RUNNER_TEMP/unstarted.txt")"; then
            cat "$RUNNER_TEMP/unstarted.txt" >&2
            exit 1
          fi
          echo "Attempt $ATTEMPT: $verdict"
          # Draft, Linux, Windows or publish never started: not re-run on
          # purpose (it may be a cancel by hand). Say so where a person looks.
          if [ -s "$RUNNER_TEMP/unstarted.txt" ]; then
            msg="Release run $RUN_ID: $(cat "$RUNNER_TEMP/unstarted.txt"). Not re-run automatically; re-run them by hand if the cancel was not yours."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Only ever a single macOS job by id: never "re-run all failed jobs",
          # which would include publish.
          case "$verdict" in
            rerun-job\ *) endpoint="repos/$GITHUB_REPOSITORY/actions/jobs/${verdict#rerun-job }/rerun" ;;
            *) exit 0 ;;
          esac
          # A refused re-run (the run started again a moment ago, or GitHub
          # will not re-run it) is not a broken release: say why and leave the
          # rest to Release mac backfill and the issue it keeps.
          if ! out="$(gh api -X POST "$endpoint" 2>&1)"; then
            echo "::warning::Re-run was refused: $out"
          fi
