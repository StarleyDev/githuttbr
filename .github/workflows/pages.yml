name: Pages

# The site is generated from the same Markdown the app ships, so it is rebuilt
# whenever a release goes out (new version number and download links) or the
# docs change on main. Manual runs are allowed for when only the generator moved.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-site.mjs'
      - 'scripts/site-i18n/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read-only by default. Only deploy can publish: the build job runs npm ci and
# the site generator, and does not need a token that can push to Pages.
permissions:
  contents: read

# Never let two deploys race; let a newer one wait rather than cancel, so a
# release deploy is not dropped by a docs push landing at the same moment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The generator needs `marked` and nothing else. Skipping devDependencies
      # and install scripts keeps Electron, Playwright and the tree-sitter
      # grammars out of a job that only renders HTML.
      - name: Install
        run: npm ci --omit=dev --ignore-scripts

      - name: Check the docs still line up
        run: node scripts/docs-check.mjs

      - name: Build the site
        run: node scripts/build-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site
          # v4+ leaves dotfiles out by default; keep `.nojekyll` as before.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages publishes the artifact and proves who it is with an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
