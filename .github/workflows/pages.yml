name: Pages

# The site is generated from the same Markdown the app ships, so it is rebuilt
# whenever a release goes out (new version number and download links) or the
# docs change on main. Manual runs are allowed for when only the generator moved.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-site.mjs'
      - 'scripts/site-i18n/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one wait rather than cancel, so a
# release deploy is not dropped by a docs push landing at the same moment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The generator needs `marked` and nothing else. Skipping devDependencies
      # and install scripts keeps Electron, Playwright and the tree-sitter
      # grammars out of a job that only renders HTML.
      - name: Install
        run: npm ci --omit=dev --ignore-scripts

      - name: Check the docs still line up
        run: node scripts/docs-check.mjs

      - name: Build the site
        run: node scripts/build-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
