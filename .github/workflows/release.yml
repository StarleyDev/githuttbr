name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; each job that publishes asks for write itself.
permissions:
  contents: read

jobs:
  release:
    # electron-builder --publish uploads the assets to the draft release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    # 'true' when the macOS signing cert secret is configured. Drives whether the
    # mac build is signed + notarized or shipped unsigned. See docs/code-signing-macos.md.
    env:
      HAS_APPLE_CERT: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # No secret in this step's env, and checkout keeps no token in .git/config:
      # the install scripts of a thousand packages run here.
      - name: Install dependencies
        run: npm ci

      # electron-builder 24.13.3 created a temp keychain with a random
      # password, then called `security set-key-partition-list -k` with the
      # .p12 password instead (electron-builder#10066), which macos-26 rejects.
      # 26.x passes the keychain password, but this import is the path that is
      # known to sign on macos-26, so it stays: we import the cert ourselves and
      # keep CSC_LINK unset so builder only finds the identity already there.
      - name: Import signing cert
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          # Generated values are not secrets GitHub knows about, so mask them
          # before anything can print them — and before they reach GITHUB_ENV.
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          P12_PASSWORD="$(printf '%s' "${CSC_KEY_PASSWORD:-}" | tr -d '\r\n')"
          if [ -n "$P12_PASSWORD" ]; then echo "::add-mask::$P12_PASSWORD"; fi
          export CERT_PATH
          python3 -c 'import os, base64; open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CSC_LINK"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application'; then
            echo 'No Developer ID Application identity in the signing keychain'
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # macOS WITH signing secrets -> signed + notarized. electron-builder 25+
      # takes `mac.notarize` as a boolean only and reads APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID from the environment, so
      # the team id is no longer passed as --config.mac.notarize.teamId.
      - name: Build and publish (signed macOS)
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          npm run release -- --config.forceCodeSigning=true

      # Everything else: unsigned macOS (no secrets), or Windows/Linux.
      # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from failing
      # when no signing identity is present (harmless on Windows/Linux).
      - name: Build and publish (unsigned)
        if: matrix.os != 'macos-latest' || env.HAS_APPLE_CERT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release

  # Flip the draft release to published, but ONLY after all three build jobs
  # succeed. If any OS build fails, this job is skipped and the release stays a
  # hidden draft (no half-uploaded release ever goes public).
  publish:
    needs: release
    runs-on: ubuntu-latest
    # gh release edit flips the draft.
    permissions:
      contents: write
    # The tag name is attacker-shaped input as far as a shell is concerned: it
    # reaches the scripts through env, never through ${{ }} inside run:.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract changelog for this version
        run: |
          # No pipefail: head closing the pipe early must not fail the step.
          set -eu
          # [[ =~ ]] tests the whole string; grep would pass a multi-line value
          # on one matching line. The optional suffix keeps tags like
          # v4.26.0-huttbr.1 publishable.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish: tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          # Write to a file (not a shell arg) so notes containing quotes,
          # backticks or $() never get re-interpreted by the shell.
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md \
            | sed '/^$/d' | head -100 > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --notes-file release-notes.md
