name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; each job that publishes asks for write itself.
permissions:
  contents: read

jobs:
  # One draft for every job to attach to. Without it Linux and Windows raced to
  # create it (electron-builder creates one when none exists), and macOS — which
  # uploads with gh, not electron-builder — would have nothing to upload to.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the draft release if it does not exist
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to release: tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            # The title is the bare version, as electron-builder names its drafts.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "${TAG#v}" --notes ''
          fi

  # Linux and Windows. electron-builder --publish uploads to the draft above.
  release:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # No secret in this step's env, and checkout keeps no token in .git/config:
      # the install scripts of a thousand packages run here.
      - name: Install dependencies
        run: npm ci

      # CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder from looking
      # for a signing identity (harmless on Windows/Linux).
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release

  # macOS no longer blocks the release. It builds in its own reusable workflow
  # and attaches its files whenever it gets a runner — before or after the
  # release goes public. When it never does, Release retry re-runs just this
  # job, and Release mac backfill keeps trying for 48 h. Pinned to macos-26
  # (what macos-latest points at since the 2026 migration) so the image does not
  # change under a release unannounced.
  mac:
    needs: draft
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/release-mac.yml
    with:
      tag: ${{ github.ref_name }}
      runner: macos-26
      # Matches MAX_ATTEMPTS in release-retry.yml: the issue opens once the
      # automatic re-runs are used up, not on the first empty queue.
      notify-from-attempt: 3
    secrets: inherit

  # Flip the draft release to published, but ONLY after the Linux and Windows
  # jobs succeed and their update files and binaries are all attached. If
  # either fails, this job is skipped and the release stays a hidden draft (no
  # half-uploaded release ever goes public). macOS is not waited for.
  publish:
    needs: release
    runs-on: ubuntu-latest
    # gh release edit flips the draft.
    permissions:
      contents: write
    # The tag name is attacker-shaped input as far as a shell is concerned: it
    # reaches the scripts through env, never through ${{ }} inside run:.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract changelog for this version
        run: |
          # No pipefail: head closing the pipe early must not fail the step.
          set -eu
          # [[ =~ ]] tests the whole string; grep would pass a multi-line value
          # on one matching line. The optional suffix keeps tags like
          # v4.26.0-huttbr.1 publishable.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish: tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          # Write to a file (not a shell arg) so notes containing quotes,
          # backticks or $() never get re-interpreted by the shell.
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md \
            | sed '/^$/d' | head -100 > release-notes.md

      # Both jobs reporting success is not proof: check that latest.yml and
      # latest-linux.yml are attached and that every file they name is too.
      - name: Check Linux and Windows are complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ymls"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/assets.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/ymls" --clobber \
            --pattern latest.yml --pattern latest-linux.yml || true
          node scripts/release-assets.mjs gate "$RUNNER_TEMP/assets.json" "$RUNNER_TEMP/ymls"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --notes-file release-notes.md
